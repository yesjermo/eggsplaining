services:
  - type: web
    name: eggsplaining
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_REPO
        value: yesjermo/eggsplaining-data
      # paste in the Render dashboard; never committed
      - key: GITHUB_TOKEN
        sync: false
